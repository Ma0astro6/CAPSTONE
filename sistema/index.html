<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elalmendro Ecohotel — Acceso interno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <section class="login">
    <div class="login-card">
      <div class="logo-wrap">
        <svg viewBox="0 0 220 90" xmlns="http://www.w3.org/2000/svg" height="90"><g fill="none" stroke="#111" stroke-width="3"><circle cx="110" cy="22" r="14"/></g><text x="110" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="22">Elalmendro</text><text x="110" y="78" text-anchor="middle" font-family="Calibri, sans-serif" font-size="12">ecohotel</text></svg>
      </div>
      <p class="sub">Obras, mantención y mejora — acceso interno</p>
      <p class="banner">Prototipo estructural (Fase 2). Cualquier usuario y clave sirven para entrar. No hay base de datos todavía.</p>
      <label>Correo o usuario</label>
      <input id="u" type="text" value="andres.cordero" />
      <label>Contraseña</label>
      <input id="p" type="password" />
      <div class="row-inline">
        <label style="margin:0"><input type="checkbox" onchange="togglePass()" /> Mostrar contraseña</label>
        <span>¿Olvidaste tu contraseña?</span>
      </div>
      <div id="err" style="color:#8a3b22;min-height:18px;margin-top:8px"></div>
      <button class="btn btn-full" type="button" onclick="login('admin')">Iniciar sesión</button>
      <button class="btn btn-full btn-gold" type="button" onclick="login('user')">Entrar como mantención</button>
    </div>
  </section>
  <script src="js/app.js"></script>
</body>
</html>
