<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Refrigeradores</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Refrigeradores", href:"refrigeradores.html"}], { agenda: false });
    catalogo({
      title: "Refrigeradores",
      extra: tabsEquipos("refrigeradores.html"),
      note: "Hoja Refrigerador de LISTA DE MANTENCIONES (MIMET, cocina, eventos). Misma lógica que Máquinas y Radiadores.",
      rows: MG.refrigeradores,
      filterKey: "ubicacion",
      filterAll: "Todas las ubicaciones",
      searchPlaceholder: "Buscar equipo o zona",
      searchKeys: ["equipo", "ubicacion", "proveedor", "quien"],
      pickLabel: (r) => r.equipo,
      nameKey: "equipo",
      editKeys: ["equipo", "ubicacion", "proveedor"],
      cols: [
        { key: "equipo", label: "Equipo" },
        { key: "ubicacion", label: "Ubicación" },
        { key: "proveedor", label: "Proveedor" },
        { key: "ultima", label: "Última", chip: true, warnEmpty: true },
        { key: "quien", label: "Quién" },
        { key: "detalle", label: "Detalle" }
      ]
    });
  </script>
</body>
</html>
