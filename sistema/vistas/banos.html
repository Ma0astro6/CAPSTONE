<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baños</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Baños", href:"banos.html"}], { agenda: false });
    catalogo({
      title: "Mantención de baños",
      extra: tabsHab("banos.html"),
      note: "Modificar cambia lavamanos, tina o porta rollo. Registrar visita no pisa esos campos.",
      rows: MG.banos,
      searchPlaceholder: "Buscar recinto",
      searchKeys: ["recinto", "lavamanos", "tina", "porta_rollo"],
      pickLabel: (r) => r.recinto,
      nameKey: "recinto",
      editKeys: ["recinto", "lavamanos", "tina", "porta_rollo"],
      cols: [
        { key: "recinto", label: "Recinto" },
        { key: "lavamanos", label: "Lavamanos" },
        { key: "tina", label: "Tina / ducha" },
        { key: "porta_rollo", label: "Porta rollo" },
        { key: "ultima", label: "Última visita", chip: true, warnEmpty: true }
      ]
    });
  </script>
</body>
</html>
