<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fosas y agua</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Fosas y agua", href:"fosas.html"}], { agenda: false });
    catalogo({
      title: "Fosas, graseras y planta",
      extra: tabsPredio("fosas.html") + '<div class="contactos">' + MG.fosas_contactos.map((c) => `<span><b>${c.quien}</b> · ${c.dato}</span>`).join("") + "</div>",
      note: "Visita nueva a la derecha. Modificar abre ventana. Ver detalle muestra succiones anteriores.",
      rows: MG.fosas,
      filterKey: "tipo",
      filterAll: "Todos los tipos",
      searchPlaceholder: "Buscar fosa, grasera o planta",
      searchKeys: ["punto", "ubicacion", "tipo"],
      pickLabel: (r) => r.punto,
      nameKey: "punto",
      editKeys: ["punto", "tipo", "ubicacion"],
      cols: [
        { key: "punto", label: "Punto" },
        { key: "tipo", label: "Tipo" },
        { key: "ubicacion", label: "Ubicación" },
        { key: "ultima", label: "Última succión", chip: true, warnEmpty: true }
      ]
    });
  </script>
</body>
</html>
