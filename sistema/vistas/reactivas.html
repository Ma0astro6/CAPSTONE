<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reactivas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css?v=58" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/bd-fichas.js?v=6"></script>
  <script src="../js/stock.js?v=2"></script>
  <script src="../js/app.js?v=50"></script>
  <script src="../js/catalogo.js?v=15"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Reactivas", href:"reactivas.html"}], { agenda: false });
    const stock = `<div id="stock-box"><p class="muted-mini">Cargando el stock de la bodega…</p></div>
      <p class="muted-mini" style="text-align:center;margin-top:-8px"><a href="bodega-insumos.html">Ver la bodega y reponer</a></p>`;
    catalogo({
      title: "Reactivas / emergencias",
      extra: tabsUrg("reactivas.html") + stock,
      conStock: true,
      note: "Aviso de recepción o huésped. El stock de arriba se calcula con entradas y salidas. Al guardar una visita puedes descontar un insumo; si no alcanza, no se guarda la salida.",
      rows: MG.reactivas,
      fuente: "reactivas",
      filterKey: "zona",
      filterAll: "Todas las zonas",
      searchPlaceholder: "Buscar recambio o habitación",
      searchKeys: ["que", "zona", "stock", "quien", "detalle"],
      pickLabel: (r) => r.que + " · " + r.zona,
      nameKey: "que",
      editKeys: ["que", "zona", "stock", "costo"],
      cols: [
        { key: "que", label: "Qué se rompió" },
        { key: "zona", label: "Zona" },
        { key: "stock", label: "Repuesto anotado" },
        { key: "ultima", label: "Última", chip: true, warnEmpty: true },
        { key: "quien", label: "Quién" }
      ]
    });
  </script>
</body>
</html>
