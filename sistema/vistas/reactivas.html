<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reactivas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Reactivas", href:"reactivas.html"}], { agenda: false });
    const stock = `<div class="mini-tiles" style="justify-content:center;margin-bottom:14px">
      <div class="mini t-man"><div class="code">TP</div><b>Tapas baño</b><small>2 unidades</small></div>
      <div class="mini t-obr"><div class="code">FX</div><b>Flexibles</b><small>8 unidades</small></div>
      <div class="mini t-mej"><div class="code">SF</div><b>Sifones</b><small>5 unidades</small></div>
    </div>`;
    catalogo({
      title: "Reactivas / emergencias",
      extra: tabsUrg("reactivas.html") + stock,
      note: "Aviso de recepción o huésped. Registrar visita = intervención nueva. Modificar cambia qué se rompió o la zona.",
      rows: MG.reactivas,
      filterKey: "zona",
      filterAll: "Todas las zonas",
      searchPlaceholder: "Buscar recambio o habitación",
      searchKeys: ["que", "zona", "stock", "quien", "detalle"],
      pickLabel: (r) => r.que + " · " + r.zona,
      nameKey: "que",
      editKeys: ["que", "zona", "stock", "costo"],
      cols: [
        { key: "que", label: "Qué se rompió" },
        { key: "zona", label: "Zona" },
        { key: "stock", label: "Stock" },
        { key: "ultima", label: "Última", chip: true, warnEmpty: true },
        { key: "quien", label: "Quién" },
        { key: "detalle", label: "Detalle" }
      ]
    });
  </script>
</body>
</html>
