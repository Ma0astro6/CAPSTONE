<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carta Gantt</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css?v=62" />
</head>
<body>
  <div id="shell">
    <main class="main">
      <p class="page-kicker">Año 2026</p>
      <h2 class="page-title">Carta Gantt</h2>
      <p class="note">Son tres grupos: Mantención general, Mejoras y Remodelaciones. Abre uno y, en mantención, elige Equipos, Predio o Habitaciones. El clic en una barra muestra el detalle.</p>
      <div id="gantt-host"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/datos.js?v=9"></script>
  <script src="../js/app.js?v=57"></script>
  <script src="../js/remodelaciones.js?v=13"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Carta Gantt", href:"gantt.html"}], { agenda: false });
    const host = document.getElementById("gantt-host");
    const pintar = () => { if (window.RE) RE.pintarGantt(host); };
    if (window.cargarCierres) cargarCierres().then(pintar).catch(pintar);
    else pintar();
  </script>
</body>
</html>
