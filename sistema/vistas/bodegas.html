<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodegas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Bodegas", href:"bodegas.html"}], { agenda: false });
    catalogo({
      title: "Revisión de bodegas",
      extra: tabsPredio("bodegas.html"),
      note: "Recorrido de recintos, no inventario hotelero. Registrar visita no edita la ficha.",
      rows: MG.bodegas,
      filterKey: "ubicacion",
      filterAll: "Todas las ubicaciones",
      searchPlaceholder: "Buscar código o bodega",
      searchKeys: ["cod", "nombre", "ubicacion", "quien"],
      pickLabel: (r) => (r.cod ? r.cod + " · " : "") + r.nombre,
      nameKey: "nombre",
      editKeys: ["cod", "nombre", "ubicacion"],
      cols: [
        { key: "cod", label: "Código" },
        { key: "nombre", label: "Bodega" },
        { key: "ubicacion", label: "Ubicación" },
        { key: "ultima", label: "Última revisión", chip: true, warnEmpty: true },
        { key: "quien", label: "Quién" }
      ]
    });
  </script>
</body>
</html>
