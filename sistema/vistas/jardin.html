<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jardinería</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Jardinería", href:"jardin.html"}], { agenda: false });
    const riego = '<div class="riego-grid">' + MG.riego.map((x) => `<div><b>${x.dia}</b>${x.zona}</div>`).join("") + "</div>";
    const lab = '<p class="note">' + MG.labores.map((x) => `<b>${x.sector}:</b> ${x.faena}`).join(" · ") + "</p>";
    catalogo({
      title: "Jardinería",
      extra: tabsPredio("jardin.html") + riego + lab,
      note: "Faena = fila. Visita nueva a la derecha. Modificar corrige sector o texto. Ver detalle es el historial.",
      rows: MG.jardin,
      filterKey: "sector",
      filterAll: "Todos los sectores",
      searchPlaceholder: "Buscar faena o sector",
      searchKeys: ["faena", "sector", "temporada", "prioridad"],
      pickLabel: (r) => r.faena,
      nameKey: "faena",
      editKeys: ["sector", "prioridad", "faena", "temporada"],
      cols: [
        { key: "sector", label: "Sector" },
        { key: "prioridad", label: "Prioridad" },
        { key: "faena", label: "Faena" },
        { key: "temporada", label: "Temporada" },
        { key: "ultima", label: "Última", chip: true, warnEmpty: true }
      ]
    });
  </script>
</body>
</html>
