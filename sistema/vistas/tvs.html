<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Televisores</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Televisores", href:"tvs.html"}], { agenda: false });
    catalogo({
      title: "Televisores por habitación",
      extra: tabsHab("tvs.html"),
      note: "La ficha (marca, pulgadas, controles) se edita en Modificar. Las pilas van en la lista de al lado.",
      rows: MG.tvs,
      filterKey: "marca",
      filterAll: "Todas las marcas",
      searchPlaceholder: "Buscar habitación o pulgadas",
      searchKeys: ["zona", "marca", "pulgadas"],
      pickLabel: (r) => r.zona + " · " + r.marca,
      nameKey: "zona",
      editKeys: ["zona", "marca", "pulgadas", "control_tv", "control_deco"],
      cols: [
        { key: "zona", label: "Zona" },
        { key: "marca", label: "Marca" },
        { key: "pulgadas", label: "Pulgadas" },
        { key: "control_tv", label: "Control TV" },
        { key: "control_deco", label: "Control deco" },
        { key: "ultima", label: "Última", chip: true, warnEmpty: true }
      ]
    });
  </script>
</body>
</html>
