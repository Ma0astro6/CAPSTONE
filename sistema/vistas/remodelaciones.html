<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remodelaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css?v=58" />
</head>
<body>
  <div id="shell">
    <main class="main">
      <p class="page-kicker">Remodelaciones</p>
      <h2 class="page-title">Elige zona, después la obra</h2>
      <p style="text-align:center"><button class="btn" type="button" id="tour-abrir">Instrucciones</button></p>
      <p class="note">El año de arriba corta el mapa. Naranja: obra abierta. Verde claro: cerrada ese año. Verde oscuro: sin obra.</p>
      <p class="muted-mini" id="re-msg">Cargando…</p>

      <div class="hud-stats">
        <div class="stat"><i>Obras del año</i><b id="hud-total">—</b></div>
        <div class="stat"><i>Abiertas</i><b id="hud-abiertas">—</b></div>
        <div class="stat"><i>Gasto con IVA</i><b id="hud-gasto">—</b></div>
      </div>

      <section class="deck" style="margin-bottom:16px">
        <div class="deck-head">
          <h3>Apoyo de obra</h3>
          <span class="deck-tag">RE</span>
        </div>
        <a class="quest" data-menu="proveedores" href="proveedores.html"><b>Proveedores</b><span>Sodimac · Easy</span></a>
        <a class="quest" data-menu="bodega" href="bodega-insumos.html"><b>Bodega de insumos</b><span>pintura · tapas</span></a>
      </section>

      <div class="filters" style="justify-content:flex-start;align-items:center">
        <div class="anio-switch" id="anio-re" role="group" aria-label="Año"></div>
        <input type="search" id="filtro-zona" placeholder="Buscar zona o número (107, Sol…)" />
      </div>

      <div class="deck-board" id="tableros"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/app.js?v=50"></script>
  <script src="../js/remodelaciones.js?v=12"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Remodelaciones", href:"remodelaciones.html"}], { agenda: false });
    RE.montarHub();

    const PASOS = [
      { sel: ".page-title", tit: "Remodelaciones", txt: "Aquí se ven las obras del hotel, pieza por pieza. El recorrido te muestra cada parte. Dale a Siguiente." },
      { sel: "#anio-re", tit: "El año", txt: "El año es el del inicio de la obra. 2026 muestra solo lo que partió en 2026. Si cambias a 2025 y no hay obras, el mapa queda sin marcas." },
      { sel: ".hud-stats", tit: "Los números", txt: "Obras del año, cuántas siguen abiertas y el gasto con IVA. El gasto suma las compras de esas obras, no las de otro año." },
      { sel: ".deck-board", tit: "Los colores", txt: "Naranja: la obra de ese año sigue abierta. Verde claro: ya se cerró. Verde oscuro, o la frase «sin obra»: ese lugar no tuvo trabajo ese año." },
      { sel: "#deck-predio", tit: "El predio", txt: "No son las habitaciones 101, 201 o 301. El predio es la casa, el centro de eventos, el hotel en general y las cabañas Luna y Sol. Funciona igual que una pieza: un clic abre la obra de ese año. Si todavía no hay, aparece el formulario para abrirla, con el inicio dentro del año elegido." },
      { sel: "#filtro-zona", tit: "Buscar", txt: "Escribe 107 o Sol y el mapa se queda solo con lo que coincide. Sirve cuando no quieres recorrer piso por piso." },
      { sel: ".room-chip, .quest", tit: "Entrar a una zona", txt: "Un clic abre la ficha: compras, hitos y estado. Si ese año no hay obra, el formulario para abrirla queda con el inicio dentro del año." },
      { sel: "[data-menu='bodega']", tit: "Apoyo de obra", txt: "Proveedores y bodega están arriba. La bodega guarda pintura, tapas y pilas. No es la obra de una habitación: es el inventario." }
    ];
    let paso = 0;
    let foco = null;
    let tarjeta = null;

    function marcar() {
      const pasoActual = PASOS[paso];
      const meta = document.querySelector(pasoActual.sel);
      if (foco) foco.remove();
      if (meta) {
        meta.scrollIntoView({ block: "center" });
        const r = meta.getBoundingClientRect();
        foco = document.createElement("div");
        foco.className = "tour-foco";
        foco.style.top = Math.max(8, r.top - 6) + "px";
        foco.style.left = Math.max(8, r.left - 6) + "px";
        foco.style.width = Math.max(24, r.width + 12) + "px";
        foco.style.height = Math.max(24, r.height + 12) + "px";
        document.body.appendChild(foco);
      }
      tarjeta.querySelector("h3").textContent = pasoActual.tit + " · " + (paso + 1) + " de " + PASOS.length;
      tarjeta.querySelector("p").textContent = pasoActual.txt;
      tarjeta.querySelector("#tour-atras").disabled = paso === 0;
      tarjeta.querySelector("#tour-sig").textContent = paso === PASOS.length - 1 ? "Listo" : "Siguiente";
    }

    function cerrarTour() {
      if (foco) foco.remove();
      if (tarjeta) tarjeta.remove();
      foco = null;
      tarjeta = null;
    }

    function abrirTour() {
      if (tarjeta) return;
      paso = 0;
      tarjeta = document.createElement("div");
      tarjeta.className = "tour-card";
      tarjeta.innerHTML = "<h3></h3><p></p><div class='tour-acciones'><button class='btn btn-ghost' type='button' id='tour-cerrar'>Cerrar</button><button class='btn btn-ghost' type='button' id='tour-atras'>Atrás</button><button class='btn' type='button' id='tour-sig'>Siguiente</button></div>";
      document.body.appendChild(tarjeta);
      tarjeta.querySelector("#tour-cerrar").onclick = cerrarTour;
      tarjeta.querySelector("#tour-atras").onclick = () => { if (paso > 0) { paso -= 1; marcar(); } };
      tarjeta.querySelector("#tour-sig").onclick = () => {
        if (paso >= PASOS.length - 1) { cerrarTour(); return; }
        paso += 1;
        marcar();
      };
      marcar();
    }

    document.getElementById("tour-abrir").onclick = () => {
      const listo = document.getElementById("anio-re") && document.getElementById("anio-re").children.length;
      if (!listo) {
        if (window.cuadro) cuadro("Espera un momento", "El mapa todavía está cargando.");
        return;
      }
      abrirTour();
    };
  </script>
</body>
</html>
