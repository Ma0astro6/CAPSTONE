<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Puertas</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <div id="shell"><main class="main"></main></div>
  <script src="../js/datos-mg.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/catalogo.js"></script>
  <script>
    mount([{label:"Inicio", href:"inicio.html"},{label:"Mantención", href:"mantencion.html"},{label:"Puertas", href:"puertas.html"}], { agenda: false });
    catalogo({
      title: "Puertas por engrasar y aceitar",
      extra: tabsHab("puertas.html"),
      note: "Engrase = visita nueva. Modificar corrige el nombre o la zona, no el historial.",
      rows: MG.puertas,
      filterKey: "ubicacion",
      filterAll: "Todas las ubicaciones",
      searchPlaceholder: "Buscar puerta o zona",
      searchKeys: ["puerta", "ubicacion", "quien"],
      pickLabel: (r) => r.puerta,
      nameKey: "puerta",
      editKeys: ["puerta", "ubicacion"],
      cols: [
        { key: "puerta", label: "Puerta" },
        { key: "ubicacion", label: "Ubicación" },
        { key: "ultima", label: "Última", chip: true, warnEmpty: true },
        { key: "quien", label: "Quién" }
      ]
    });
  </script>
</body>
</html>
